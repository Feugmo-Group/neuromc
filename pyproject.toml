[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromc"
version = "0.2.0"
description = "Neural Monte Carlo: GCMC, classical DFT, and neural functional theory with machine-learned interatomic potentials"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Conrard Tetsassi Feugmo" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["ase", "huggingface_hub"]

[project.optional-dependencies]
dev = ["pytest"]
fairchem = ["fairchem-core"]
mace-torch = ["mace-torch"]
orb-models = ["orb-models"]
dft = ["nvalchemi-toolkit", "warp-lang", "h5py", "pyyaml", "torch-sim-atomistic"]

[tool.uv]
dev-dependencies = ["pytest"]

[project.scripts]
neuromc = "neuromc.cli:main"

[project.urls]
Homepage = "https://github.com/Feugmo-Group/neuromc"
"Original MLIP-MC" = "https://github.com/jackevansadl/MLIP-MC"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["neuromc", "neuromc.*"]

[tool.setuptools.package-data]
neuromc = ["data/*.csv"]
